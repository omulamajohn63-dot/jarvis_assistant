[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    # The document readers are optional and are expected to be absent or
    # incompatible for some formats; the tests assert on the behaviour, not on
    # what the libraries warn about.
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]